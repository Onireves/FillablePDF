<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FillablePDF - All-in-One PDF Editor</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f0f13; --bg2: #1a1a24; --bg3: #242435; --bg4: #2e2e44;
            --surface: #1e1e2e; --surface2: #2a2a3d;
            --border: #333350; --border2: #444466;
            --text: #e8e8f0; --text2: #a0a0b8; --text3: #707088;
            --primary: #7c5cff; --primary2: #9b7fff; --primary-bg: rgba(124,92,255,0.12);
            --accent: #00d4aa; --accent-bg: rgba(0,212,170,0.1);
            --danger: #ff5c7c; --danger-bg: rgba(255,92,124,0.1);
            --warning: #ffb347; --warning-bg: rgba(255,179,71,0.1);
            --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: var(--text); transition: all var(--transition); }
        input, select { font-family: inherit; }

        .header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; background: var(--bg2); border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .logo svg { width: 28px; height: 28px; }
        .logo span { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-xs); font-size: 13px; font-weight: 500; transition: all var(--transition); white-space: nowrap; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,92,255,0.3); }
        .btn-ghost { background: transparent; color: var(--text2); }
        .btn-ghost:hover { background: var(--bg3); color: var(--text); }
        .btn-outline { border: 1px solid var(--border); background: var(--bg3); }
        .btn-outline:hover { border-color: var(--primary); background: var(--primary-bg); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { box-shadow: 0 4px 16px rgba(255,92,124,0.3); }
        .btn-icon { width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xs); }
        .btn-icon:hover { background: var(--bg3); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .app { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: width var(--transition); }
        .sidebar.collapsed { width: 0; border: none; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); }
        .page-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .page-list::-webkit-scrollbar { width: 4px; }
        .page-list::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
        .page-thumb { position: relative; border-radius: var(--radius-sm); overflow: hidden; border: 2px solid transparent; cursor: pointer; transition: all var(--transition); background: var(--bg3); }
        .page-thumb:hover { border-color: var(--border2); }
        .page-thumb.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-bg); }
        .page-thumb canvas { width: 100%; display: block; }
        .page-thumb-label { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; backdrop-filter: blur(4px); }
        .page-thumb-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; opacity: 0; transition: opacity var(--transition); }
        .page-thumb:hover .page-thumb-actions { opacity: 1; }
        .page-thumb-actions button { width: 24px; height: 24px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; backdrop-filter: blur(4px); }
        .page-thumb-actions button:hover { background: var(--primary); }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .toolbar-group { display: flex; align-items: center; gap: 2px; padding: 0 4px; }
        .toolbar-divider { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }
        .tool-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xs); color: var(--text2); position: relative; }
        .tool-btn:hover { background: var(--bg3); color: var(--text); }
        .tool-btn.active { background: var(--primary-bg); color: var(--primary2); }
        .tool-btn svg { width: 18px; height: 18px; }
        .tool-btn .tooltip { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); background: var(--bg4); color: var(--text); font-size: 11px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 50; }
        .tool-btn:hover .tooltip { opacity: 1; }

        .toolbar-select { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 4px 8px; color: var(--text); font-size: 12px; }
        .toolbar-select:focus { outline: none; border-color: var(--primary); }
        .color-picker-btn { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; }
        .color-picker-btn:hover { border-color: var(--text2); }
        input[type="color"] { position: absolute; opacity: 0; width: 0; height: 0; }

        .canvas-area { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 24px; background: var(--bg); position: relative; }
        .canvas-area::-webkit-scrollbar { width: 8px; height: 8px; }
        .canvas-area::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
        .canvas-container { position: relative; box-shadow: var(--shadow); border-radius: 4px; overflow: hidden; }
        .canvas-container canvas { display: block; }
        #pdfCanvas { position: absolute; top: 0; left: 0; }
        #overlayCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; z-index: 10; }

        .drop-zone { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .drop-zone-inner { text-align: center; padding: 60px 80px; border: 2px dashed var(--border); border-radius: 24px; background: var(--surface); transition: all var(--transition); max-width: 600px; }
        .drop-zone-inner.dragover { border-color: var(--primary); background: var(--primary-bg); transform: scale(1.02); }
        .drop-zone-icon { width: 80px; height: 80px; margin: 0 auto 24px; background: var(--primary-bg); border-radius: 20px; display: flex; align-items: center; justify-content: center; }
        .drop-zone-icon svg { width: 40px; height: 40px; color: var(--primary); }
        .drop-zone h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .drop-zone p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
        .drop-zone .features { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
        .drop-zone .feature-tag { font-size: 12px; padding: 5px 12px; background: var(--bg3); border-radius: 20px; color: var(--text2); }

        .properties { width: 260px; background: var(--bg2); border-left: 1px solid var(--border); flex-shrink: 0; overflow-y: auto; display: none; }
        .properties.open { display: block; }
        .properties-section { padding: 16px; border-bottom: 1px solid var(--border); }
        .properties-section h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); margin-bottom: 12px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal h3 { font-size: 18px; margin-bottom: 16px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; animation: slideIn 0.3s ease; box-shadow: var(--shadow); }
        .toast-success { background: var(--accent); color: #000; }
        .toast-error { background: var(--danger); color: #fff; }
        .toast-info { background: var(--primary); color: #fff; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .zoom-controls { position: absolute; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; box-shadow: var(--shadow); z-index: 20; }
        .zoom-controls span { font-size: 12px; color: var(--text2); padding: 0 8px; min-width: 48px; text-align: center; }

        .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px; background: var(--bg2); border-top: 1px solid var(--border); font-size: 11px; color: var(--text3); flex-shrink: 0; }

        .annotation-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: var(--bg3); border-radius: var(--radius-xs); margin-bottom: 6px; font-size: 12px; }
        .annotation-item:hover { background: var(--bg4); }

        @media (max-width: 768px) { .sidebar { width: 200px; } .properties { width: 200px; } }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <svg viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="24" height="24" rx="6" fill="url(#lg)"/><path d="M9 8h7l4 4v8a2 2 0 01-2 2H9a2 2 0 01-2-2V10a2 2 0 012-2z" fill="#fff" fill-opacity="0.9"/><path d="M15 8v5h5" fill="#fff" fill-opacity="0.5"/><defs><linearGradient id="lg" x1="2" y1="2" x2="26" y2="26"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#00d4aa"/></linearGradient></defs></svg>
        <span>FillablePDF</span>
    </div>
    <div class="header-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('fileInput').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            Open PDF
        </button>
        <button class="btn btn-ghost" onclick="openMergeModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="8" height="8" rx="1"/><rect x="14" y="13" width="8" height="8" rx="1"/><path d="M10 7h4v4"/><path d="M14 7v10"/></svg>
            Merge
        </button>
        <button class="btn btn-ghost" onclick="splitPDF()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><polyline points="8,6 4,2 4,22 8,18"/><polyline points="16,6 20,2 20,22 16,18"/></svg>
            Split
        </button>
        <button class="btn btn-primary" onclick="savePDF()" id="saveBtn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save PDF
        </button>
    </div>
</header>

<input type="file" id="fileInput" accept="application/pdf" style="display:none" multiple>
<input type="file" id="mergeInput" accept="application/pdf" style="display:none" multiple>
<input type="file" id="imageInput" accept="image/*" style="display:none">

<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Pages</h3>
            <div style="display:flex;gap:4px;">
                <button class="btn-icon" onclick="addBlankPage()" title="Add blank page">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        </div>
        <div class="page-list" id="pageList"></div>
    </aside>

    <main class="main">
        <div class="toolbar" id="toolbar" style="display:none;">
            <div class="toolbar-group">
                <button class="tool-btn" onclick="toggleSidebar()" title="Toggle sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                    <span class="tooltip">Pages</span>
                </button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="tool-btn active" data-tool="select" onclick="setTool('select')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg><span class="tooltip">Select (V)</span></button>
                <button class="tool-btn" data-tool="text" onclick="setTool('text')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,7 4,4 20,4 20,7"/><line x1="9.5" y1="20" x2="14.5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg><span class="tooltip">Text (T)</span></button>
                <button class="tool-btn" data-tool="draw" onclick="setTool('draw')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg><span class="tooltip">Draw (D)</span></button>
                <button class="tool-btn" data-tool="highlight" onclick="setTool('highlight')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></svg><span class="tooltip">Highlight (H)</span></button>
                <button class="tool-btn" data-tool="rect" onclick="setTool('rect')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span class="tooltip">Rectangle (R)</span></button>
                <button class="tool-btn" data-tool="circle" onclick="setTool('circle')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg><span class="tooltip">Circle (C)</span></button>
                <button class="tool-btn" data-tool="line" onclick="setTool('line')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg><span class="tooltip">Line (L)</span></button>
                <button class="tool-btn" data-tool="arrow" onclick="setTool('arrow')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg><span class="tooltip">Arrow (A)</span></button>
                <button class="tool-btn" data-tool="image" onclick="document.getElementById('imageInput').click()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg><span class="tooltip">Image (I)</span></button>
                <button class="tool-btn" data-tool="erase" onclick="setTool('erase')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9-9 8 8-4 4z"/><line x1="6" y1="11" x2="13" y2="18"/></svg><span class="tooltip">Eraser (E)</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <div style="position:relative">
                    <div class="color-picker-btn" id="colorPreview" style="background:#7c5cff" onclick="document.getElementById('colorPicker').click()"></div>
                    <input type="color" id="colorPicker" value="#7c5cff" onchange="state.color=this.value;document.getElementById('colorPreview').style.background=this.value">
                </div>
                <select class="toolbar-select" id="strokeWidth" onchange="state.strokeWidth=+this.value">
                    <option value="1">1px</option><option value="2" selected>2px</option><option value="3">3px</option><option value="5">5px</option><option value="8">8px</option>
                </select>
                <select class="toolbar-select" id="fontSize" onchange="state.fontSize=+this.value">
                    <option value="10">10pt</option><option value="12">12pt</option><option value="14" selected>14pt</option><option value="16">16pt</option><option value="18">18pt</option><option value="20">20pt</option><option value="24">24pt</option><option value="32">32pt</option><option value="48">48pt</option>
                </select>
                <select class="toolbar-select" id="fontFamily" onchange="state.fontFamily=this.value">
                    <option value="Helvetica">Helvetica</option><option value="Times-Roman">Times</option><option value="Courier">Courier</option>
                </select>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="tool-btn" onclick="rotatePage(-90)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg><span class="tooltip">Rotate Left</span></button>
                <button class="tool-btn" onclick="rotatePage(90)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/></svg><span class="tooltip">Rotate Right</span></button>
                <button class="tool-btn" onclick="deletePage()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><span class="tooltip">Delete Page</span></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
                <button class="tool-btn" onclick="undo()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg><span class="tooltip">Undo (Ctrl+Z)</span></button>
                <button class="tool-btn" onclick="redo()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/></svg><span class="tooltip">Redo (Ctrl+Y)</span></button>
            </div>
        </div>

        <div class="canvas-area" id="canvasArea">
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-inner" id="dropZoneInner">
                    <div class="drop-zone-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    </div>
                    <h2>Drop your PDF here</h2>
                    <p>or click to browse files</p>
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()" style="margin-bottom:16px">Choose PDF File</button>
                    <div class="features">
                        <span class="feature-tag">Edit Text</span><span class="feature-tag">Draw &amp; Annotate</span><span class="feature-tag">Add Images</span><span class="feature-tag">Fill Forms</span><span class="feature-tag">Merge PDFs</span><span class="feature-tag">Split Pages</span><span class="feature-tag">Rotate Pages</span><span class="feature-tag">Highlight</span><span class="feature-tag">Shapes</span><span class="feature-tag">Undo/Redo</span>
                    </div>
                </div>
            </div>
            <div class="canvas-container" id="canvasContainer" style="display:none;">
                <canvas id="pdfCanvas"></canvas>
                <canvas id="overlayCanvas"></canvas>
            </div>
            <div class="zoom-controls" id="zoomControls" style="display:none;">
                <button class="btn-icon" onclick="changeZoom(-0.1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
                <span id="zoomLevel">100%</span>
                <button class="btn-icon" onclick="changeZoom(0.1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
                <button class="btn-icon" onclick="fitToWidth()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
            </div>
        </div>
    </main>

    <aside class="properties" id="propertiesPanel">
        <div class="properties-section">
            <h4>Annotations</h4>
            <div id="annotationList"></div>
            <button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="clearAnnotations()">Clear All Annotations</button>
        </div>
        <div class="properties-section">
            <h4>Document Info</h4>
            <div id="docInfo" style="font-size:12px;color:var(--text2)"></div>
        </div>
    </aside>
</div>

<div class="status-bar" id="statusBar">
    <span id="statusLeft">Ready</span>
    <span id="statusRight"></span>
</div>

<div class="modal-overlay" id="mergeModal">
    <div class="modal">
        <h3>Merge PDFs</h3>
        <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Select multiple PDF files to merge into one document.</p>
        <div id="mergeFileList"></div>
        <button class="btn btn-outline" onclick="document.getElementById('mergeInput').click()" style="width:100%">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add PDF Files
        </button>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeMergeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="executeMerge()" id="mergeBtn" disabled>Merge Files</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const state = {
    pdfDoc: null, pdfBytes: null, viewDoc: null,
    currentPage: 1, totalPages: 0, zoom: 1.0,
    tool: 'select', color: '#7c5cff', strokeWidth: 2, fontSize: 14, fontFamily: 'Helvetica',
    annotations: {}, rotations: {}, undoStack: [], redoStack: [],
    isDrawing: false, drawStart: null, currentPath: [], mergeFiles: [], images: {},
};

const fileInput = document.getElementById('fileInput');
const mergeInput = document.getElementById('mergeInput');
const imageInput = document.getElementById('imageInput');
const dropZone = document.getElementById('dropZone');
const dropZoneInner = document.getElementById('dropZoneInner');
const canvasContainer = document.getElementById('canvasContainer');
const pdfCanvas = document.getElementById('pdfCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');
const pdfCtx = pdfCanvas.getContext('2d');
const overlayCtx = overlayCanvas.getContext('2d');
const toolbar = document.getElementById('toolbar');
const zoomControls = document.getElementById('zoomControls');
const pageList = document.getElementById('pageList');

fileInput.addEventListener('change', e => { if (e.target.files.length > 0) loadPDF(e.target.files[0]); });
mergeInput.addEventListener('change', e => { for (const f of e.target.files) state.mergeFiles.push(f); renderMergeList(); });
imageInput.addEventListener('change', e => { if (e.target.files.length > 0) insertImage(e.target.files[0]); });

dropZoneInner.addEventListener('dragover', e => { e.preventDefault(); dropZoneInner.classList.add('dragover'); });
dropZoneInner.addEventListener('dragleave', () => dropZoneInner.classList.remove('dragover'));
dropZoneInner.addEventListener('drop', e => {
    e.preventDefault(); dropZoneInner.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') loadPDF(file);
});

async function loadPDF(file) {
    try {
        const ab = await file.arrayBuffer();
        state.pdfBytes = new Uint8Array(ab);
        state.pdfDoc = await PDFLib.PDFDocument.load(state.pdfBytes, { ignoreEncryption: true });
        state.viewDoc = await pdfjsLib.getDocument({ data: state.pdfBytes.slice() }).promise;
        state.totalPages = state.pdfDoc.getPageCount();
        state.currentPage = 1;
        state.annotations = {}; state.images = {}; state.rotations = {};
        state.undoStack = []; state.redoStack = [];
        dropZone.style.display = 'none';
        canvasContainer.style.display = 'block';
        toolbar.style.display = 'flex';
        zoomControls.style.display = 'flex';
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('propertiesPanel').classList.add('open');
        renderPage(); renderPageThumbnails(); updateDocInfo(file);
        toast('PDF loaded successfully', 'success');
    } catch (err) { console.error(err); toast('Failed to load PDF: ' + err.message, 'error'); }
}

async function renderPage() {
    if (!state.viewDoc) return;
    const page = await state.viewDoc.getPage(state.currentPage);
    const rotation = state.rotations[state.currentPage] || 0;
    const vp = page.getViewport({ scale: state.zoom * 1.5, rotation });
    pdfCanvas.width = vp.width; pdfCanvas.height = vp.height;
    overlayCanvas.width = vp.width; overlayCanvas.height = vp.height;
    canvasContainer.style.width = vp.width + 'px'; canvasContainer.style.height = vp.height + 'px';
    await page.render({ canvasContext: pdfCtx, viewport: vp }).promise;
    renderAnnotations(); renderImages(); updateStatus(); updateActiveThumbnail();
}

function renderAnnotations() {
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    const annots = state.annotations[state.currentPage] || [];
    const s = state.zoom * 1.5;
    annots.forEach(a => {
        overlayCtx.save();
        overlayCtx.strokeStyle = a.color || state.color;
        overlayCtx.fillStyle = a.color || state.color;
        overlayCtx.lineWidth = (a.strokeWidth || 2) * s / 1.5;
        overlayCtx.globalAlpha = a.opacity || 1;
        switch(a.type) {
            case 'path':
                if (a.points.length < 2) break;
                overlayCtx.beginPath(); overlayCtx.lineCap = 'round'; overlayCtx.lineJoin = 'round';
                overlayCtx.moveTo(a.points[0].x * s, a.points[0].y * s);
                for (let i = 1; i < a.points.length; i++) overlayCtx.lineTo(a.points[i].x * s, a.points[i].y * s);
                overlayCtx.stroke(); break;
            case 'highlight':
                overlayCtx.globalAlpha = 0.3;
                overlayCtx.fillRect(a.x * s, a.y * s, a.w * s, a.h * s); break;
            case 'rect':
                overlayCtx.strokeRect(a.x * s, a.y * s, a.w * s, a.h * s); break;
            case 'circle':
                overlayCtx.beginPath();
                overlayCtx.ellipse((a.x+a.w/2)*s, (a.y+a.h/2)*s, Math.abs(a.w/2)*s, Math.abs(a.h/2)*s, 0, 0, Math.PI*2);
                overlayCtx.stroke(); break;
            case 'line':
                overlayCtx.beginPath(); overlayCtx.moveTo(a.x*s, a.y*s); overlayCtx.lineTo(a.x2*s, a.y2*s); overlayCtx.stroke(); break;
            case 'arrow':
                overlayCtx.beginPath(); overlayCtx.moveTo(a.x*s, a.y*s); overlayCtx.lineTo(a.x2*s, a.y2*s); overlayCtx.stroke();
                const ang = Math.atan2(a.y2-a.y, a.x2-a.x), hl = 12*s/1.5;
                overlayCtx.beginPath(); overlayCtx.moveTo(a.x2*s, a.y2*s);
                overlayCtx.lineTo(a.x2*s - hl*Math.cos(ang-0.4), a.y2*s - hl*Math.sin(ang-0.4));
                overlayCtx.moveTo(a.x2*s, a.y2*s);
                overlayCtx.lineTo(a.x2*s - hl*Math.cos(ang+0.4), a.y2*s - hl*Math.sin(ang+0.4));
                overlayCtx.stroke(); break;
            case 'text':
                overlayCtx.globalAlpha = 1;
                overlayCtx.font = `${a.fontSize*s/1.5}px ${a.fontFamily||'Helvetica'}`;
                overlayCtx.fillText(a.text, a.x*s, a.y*s); break;
        }
        overlayCtx.restore();
    });
    updateAnnotationList();
}

function renderImages() {
    const imgs = state.images[state.currentPage] || [];
    const s = state.zoom * 1.5;
    imgs.forEach(img => overlayCtx.drawImage(img.el, img.x*s, img.y*s, img.w*s, img.h*s));
}

async function renderPageThumbnails() {
    pageList.innerHTML = '';
    for (let i = 1; i <= state.totalPages; i++) {
        const div = document.createElement('div');
        div.className = 'page-thumb' + (i === state.currentPage ? ' active' : '');
        div.onclick = () => goToPage(i);
        div.draggable = true; div.dataset.page = i;
        div.addEventListener('dragstart', e => { draggedPage = +e.currentTarget.dataset.page; e.dataTransfer.effectAllowed = 'move'; });
        div.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        div.addEventListener('drop', e => { e.preventDefault(); const t = +e.currentTarget.dataset.page; if (draggedPage && draggedPage !== t) reorderPage(draggedPage, t); });
        const c = document.createElement('canvas');
        const pg = await state.viewDoc.getPage(i);
        const vp = pg.getViewport({ scale: 0.3, rotation: state.rotations[i] || 0 });
        c.width = vp.width; c.height = vp.height;
        await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        div.appendChild(c);
        const lbl = document.createElement('div'); lbl.className = 'page-thumb-label'; lbl.textContent = i; div.appendChild(lbl);
        const acts = document.createElement('div'); acts.className = 'page-thumb-actions';
        acts.innerHTML = `<button onclick="event.stopPropagation();rotatePage(90,${i})" title="Rotate">&#x21bb;</button><button onclick="event.stopPropagation();deletePage(${i})" title="Delete">&times;</button>`;
        div.appendChild(acts); pageList.appendChild(div);
    }
}

function updateActiveThumbnail() { document.querySelectorAll('.page-thumb').forEach((el, i) => el.classList.toggle('active', i+1 === state.currentPage)); }
let draggedPage = null;

async function reorderPage(from, to) {
    try {
        const pg = state.pdfDoc.getPage(from - 1); state.pdfDoc.removePage(from - 1);
        state.pdfDoc.insertPage(to > from ? to - 1 : to - 1, pg);
        await refreshAfterEdit(); toast(`Moved page ${from} to position ${to}`, 'success');
    } catch (err) { toast('Failed to reorder pages', 'error'); }
}

function setTool(tool) {
    state.tool = tool;
    document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    overlayCanvas.style.cursor = tool === 'select' ? 'default' : tool === 'text' ? 'text' : tool === 'erase' ? 'not-allowed' : 'crosshair';
}

overlayCanvas.addEventListener('mousedown', onDown);
overlayCanvas.addEventListener('mousemove', onMove);
overlayCanvas.addEventListener('mouseup', onUp);
overlayCanvas.addEventListener('dblclick', onDbl);

function gp(e) { const r = overlayCanvas.getBoundingClientRect(), s = state.zoom*1.5; return { x: (e.clientX-r.left)/s, y: (e.clientY-r.top)/s }; }

function onDown(e) {
    const p = gp(e); state.isDrawing = true; state.drawStart = p;
    if (state.tool === 'draw') state.currentPath = [p];
    else if (state.tool === 'erase') eraseAt(p);
}

function onMove(e) {
    if (!state.isDrawing) return;
    const p = gp(e);
    if (state.tool === 'draw') {
        state.currentPath.push(p); renderAnnotations();
        const s = state.zoom*1.5;
        overlayCtx.strokeStyle = state.color; overlayCtx.lineWidth = state.strokeWidth*s/1.5;
        overlayCtx.lineCap = 'round'; overlayCtx.lineJoin = 'round'; overlayCtx.beginPath();
        overlayCtx.moveTo(state.currentPath[0].x*s, state.currentPath[0].y*s);
        for (let i = 1; i < state.currentPath.length; i++) overlayCtx.lineTo(state.currentPath[i].x*s, state.currentPath[i].y*s);
        overlayCtx.stroke();
    } else if (['highlight','rect','circle','line','arrow'].includes(state.tool)) {
        renderAnnotations();
        const s = state.zoom*1.5;
        overlayCtx.save(); overlayCtx.strokeStyle = state.color; overlayCtx.fillStyle = state.color;
        overlayCtx.lineWidth = state.strokeWidth*s/1.5;
        const sx=state.drawStart.x*s, sy=state.drawStart.y*s, ex=p.x*s, ey=p.y*s;
        if (state.tool==='highlight') { overlayCtx.globalAlpha=0.3; overlayCtx.fillRect(sx,sy,ex-sx,ey-sy); }
        else if (state.tool==='rect') overlayCtx.strokeRect(sx,sy,ex-sx,ey-sy);
        else if (state.tool==='circle') { overlayCtx.beginPath(); overlayCtx.ellipse((sx+ex)/2,(sy+ey)/2,Math.abs(ex-sx)/2,Math.abs(ey-sy)/2,0,0,Math.PI*2); overlayCtx.stroke(); }
        else if (state.tool==='line') { overlayCtx.beginPath(); overlayCtx.moveTo(sx,sy); overlayCtx.lineTo(ex,ey); overlayCtx.stroke(); }
        else if (state.tool==='arrow') {
            overlayCtx.beginPath(); overlayCtx.moveTo(sx,sy); overlayCtx.lineTo(ex,ey); overlayCtx.stroke();
            const a=Math.atan2(ey-sy,ex-sx), h=12*s/1.5;
            overlayCtx.beginPath(); overlayCtx.moveTo(ex,ey); overlayCtx.lineTo(ex-h*Math.cos(a-0.4),ey-h*Math.sin(a-0.4));
            overlayCtx.moveTo(ex,ey); overlayCtx.lineTo(ex-h*Math.cos(a+0.4),ey-h*Math.sin(a+0.4)); overlayCtx.stroke();
        }
        overlayCtx.restore();
    } else if (state.tool === 'erase') eraseAt(p);
}

function onUp(e) {
    if (!state.isDrawing) return; state.isDrawing = false; const p = gp(e);
    if (state.tool==='draw' && state.currentPath.length>1) { pushAnnotation({type:'path',points:[...state.currentPath],color:state.color,strokeWidth:state.strokeWidth}); state.currentPath=[]; }
    else if (state.tool==='highlight' && state.drawStart) pushAnnotation({type:'highlight',x:state.drawStart.x,y:state.drawStart.y,w:p.x-state.drawStart.x,h:p.y-state.drawStart.y,color:state.color});
    else if (state.tool==='rect' && state.drawStart) pushAnnotation({type:'rect',x:state.drawStart.x,y:state.drawStart.y,w:p.x-state.drawStart.x,h:p.y-state.drawStart.y,color:state.color,strokeWidth:state.strokeWidth});
    else if (state.tool==='circle' && state.drawStart) pushAnnotation({type:'circle',x:state.drawStart.x,y:state.drawStart.y,w:p.x-state.drawStart.x,h:p.y-state.drawStart.y,color:state.color,strokeWidth:state.strokeWidth});
    else if (state.tool==='line' && state.drawStart) pushAnnotation({type:'line',x:state.drawStart.x,y:state.drawStart.y,x2:p.x,y2:p.y,color:state.color,strokeWidth:state.strokeWidth});
    else if (state.tool==='arrow' && state.drawStart) pushAnnotation({type:'arrow',x:state.drawStart.x,y:state.drawStart.y,x2:p.x,y2:p.y,color:state.color,strokeWidth:state.strokeWidth});
    renderAnnotations();
}

function onDbl(e) {
    if (state.tool==='text'||state.tool==='select') {
        const p = gp(e), text = prompt('Enter text:');
        if (text) { pushAnnotation({type:'text',x:p.x,y:p.y,text,color:state.color,fontSize:state.fontSize,fontFamily:state.fontFamily}); renderAnnotations(); }
    }
}

function pushAnnotation(a) {
    if (!state.annotations[state.currentPage]) state.annotations[state.currentPage] = [];
    state.annotations[state.currentPage].push(a);
    state.undoStack.push({page:state.currentPage,action:'add',index:state.annotations[state.currentPage].length-1,annotation:a});
    state.redoStack = [];
}

function eraseAt(pos) {
    const annots = state.annotations[state.currentPage]; if (!annots) return;
    const th = 15;
    for (let i = annots.length-1; i >= 0; i--) {
        const a = annots[i]; let hit = false;
        if (a.type==='path') hit = a.points.some(p => Math.hypot(p.x-pos.x,p.y-pos.y)<th);
        else if (a.type==='text') hit = Math.hypot(a.x-pos.x,a.y-pos.y)<th*3;
        else if (a.type==='line'||a.type==='arrow') hit = distSeg(pos,{x:a.x,y:a.y},{x:a.x2,y:a.y2})<th;
        else hit = pos.x>=a.x && pos.x<=a.x+a.w && pos.y>=a.y && pos.y<=a.y+a.h;
        if (hit) { const rm = annots.splice(i,1)[0]; state.undoStack.push({page:state.currentPage,action:'remove',index:i,annotation:rm}); renderAnnotations(); return; }
    }
}

function distSeg(p,v,w) {
    const l2=(w.x-v.x)**2+(w.y-v.y)**2; if(l2===0) return Math.hypot(p.x-v.x,p.y-v.y);
    let t=((p.x-v.x)*(w.x-v.x)+(p.y-v.y)*(w.y-v.y))/l2; t=Math.max(0,Math.min(1,t));
    return Math.hypot(p.x-(v.x+t*(w.x-v.x)),p.y-(v.y+t*(w.y-v.y)));
}

function clearAnnotations() { state.annotations[state.currentPage]=[]; state.images[state.currentPage]=[]; renderAnnotations(); toast('Annotations cleared','info'); }

function updateAnnotationList() {
    const list = document.getElementById('annotationList'), annots = state.annotations[state.currentPage]||[];
    if (!annots.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text3);text-align:center;padding:16px">No annotations on this page</div>'; return; }
    list.innerHTML = annots.map((a,i) => `<div class="annotation-item"><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:${a.color}"></span>${a.type}${a.text?': '+a.text.substring(0,20):''}</span><button class="btn-icon" style="width:20px;height:20px" onclick="removeAnnotation(${i})">&times;</button></div>`).join('');
}

function removeAnnotation(i) {
    const annots = state.annotations[state.currentPage];
    if (annots && annots[i]) { const rm = annots.splice(i,1)[0]; state.undoStack.push({page:state.currentPage,action:'remove',index:i,annotation:rm}); renderAnnotations(); }
}

function undo() {
    if (!state.undoStack.length) return; const a = state.undoStack.pop();
    if (a.action==='add') { const an = state.annotations[a.page]; if(an) an.splice(a.index,1); }
    else if (a.action==='remove') { if(!state.annotations[a.page]) state.annotations[a.page]=[]; state.annotations[a.page].splice(a.index,0,a.annotation); }
    state.redoStack.push(a); if(a.page===state.currentPage) renderAnnotations();
}

function redo() {
    if (!state.redoStack.length) return; const a = state.redoStack.pop();
    if (a.action==='add') { if(!state.annotations[a.page]) state.annotations[a.page]=[]; state.annotations[a.page].splice(a.index,0,a.annotation); }
    else if (a.action==='remove') { const an = state.annotations[a.page]; if(an) an.splice(a.index,1); }
    state.undoStack.push(a); if(a.page===state.currentPage) renderAnnotations();
}

function insertImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            if (!state.images[state.currentPage]) state.images[state.currentPage] = [];
            const maxW=200, ratio=img.width/img.height, w=Math.min(img.width,maxW), h=w/ratio;
            state.images[state.currentPage].push({el:img,x:50,y:50,w,h,data:e.target.result});
            renderAnnotations(); renderImages(); toast('Image inserted','success');
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function goToPage(n) { if(n<1||n>state.totalPages) return; state.currentPage=n; renderPage(); }

async function rotatePage(deg, pn) {
    const p = pn||state.currentPage;
    state.rotations[p] = ((state.rotations[p]||0)+deg)%360;
    const pg = state.pdfDoc.getPage(p-1), cur = pg.getRotation().angle;
    pg.setRotation(PDFLib.degrees(cur+deg));
    await refreshAfterEdit();
    toast(`Page ${p} rotated ${deg>0?'clockwise':'counter-clockwise'}`,'success');
}

async function deletePage(pn) {
    const p = pn||state.currentPage;
    if (state.totalPages<=1) { toast('Cannot delete the only page','error'); return; }
    if (!confirm(`Delete page ${p}?`)) return;
    state.pdfDoc.removePage(p-1); delete state.annotations[p]; delete state.images[p];
    await refreshAfterEdit(); toast(`Page ${p} deleted`,'success');
}

async function addBlankPage() {
    const lp = state.pdfDoc.getPage(state.totalPages-1), {width,height} = lp.getSize();
    state.pdfDoc.addPage([width,height]);
    await refreshAfterEdit(); toast('Blank page added','success');
}

async function refreshAfterEdit() {
    const bytes = await state.pdfDoc.save();
    state.pdfBytes = bytes;
    state.viewDoc = await pdfjsLib.getDocument({data:bytes.slice()}).promise;
    state.totalPages = state.pdfDoc.getPageCount();
    if (state.currentPage > state.totalPages) state.currentPage = state.totalPages;
    renderPage(); renderPageThumbnails();
}

async function splitPDF() {
    if (!state.pdfDoc) { toast('Please load a PDF first','error'); return; }
    if (state.totalPages<2) { toast('Need at least 2 pages to split','error'); return; }
    const input = prompt(`Split at which page? (1-${state.totalPages})`, Math.ceil(state.totalPages/2));
    if (!input) return;
    const sp = parseInt(input);
    if (isNaN(sp)||sp<1||sp>=state.totalPages) { toast('Invalid page number','error'); return; }
    try {
        const d1 = await PDFLib.PDFDocument.create(), d2 = await PDFLib.PDFDocument.create();
        const p1 = await d1.copyPages(state.pdfDoc, Array.from({length:sp},(_,i)=>i));
        p1.forEach(p => d1.addPage(p));
        const p2 = await d2.copyPages(state.pdfDoc, Array.from({length:state.totalPages-sp},(_,i)=>i+sp));
        p2.forEach(p => d2.addPage(p));
        downloadBlob(await d1.save(),'split_part1.pdf');
        setTimeout(() => downloadBlob(d2.save().then ? null : null), 100);
        const b2 = await d2.save(); setTimeout(() => downloadBlob(b2,'split_part2.pdf'), 500);
        toast(`PDF split at page ${sp}`,'success');
    } catch (err) { toast('Split failed: '+err.message,'error'); }
}

function openMergeModal() { state.mergeFiles=[]; renderMergeList(); document.getElementById('mergeModal').classList.add('open'); }
function closeMergeModal() { document.getElementById('mergeModal').classList.remove('open'); state.mergeFiles=[]; }
function renderMergeList() {
    const list = document.getElementById('mergeFileList'), btn = document.getElementById('mergeBtn');
    if (!state.mergeFiles.length) { list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:24px;font-size:13px">No files added yet</div>'; btn.disabled=true; return; }
    btn.disabled = false;
    list.innerHTML = state.mergeFiles.map((f,i) => `<div class="annotation-item"><span>${f.name}</span><button class="btn-icon" style="width:20px;height:20px" onclick="state.mergeFiles.splice(${i},1);renderMergeList()">&times;</button></div>`).join('');
}

async function executeMerge() {
    if (!state.mergeFiles.length) return;
    try {
        const merged = await PDFLib.PDFDocument.create();
        for (const file of state.mergeFiles) {
            const bytes = await file.arrayBuffer();
            const doc = await PDFLib.PDFDocument.load(bytes);
            const pages = await merged.copyPages(doc, doc.getPageIndices());
            pages.forEach(p => merged.addPage(p));
        }
        downloadBlob(await merged.save(),'merged.pdf');
        closeMergeModal(); toast(`Merged ${state.mergeFiles.length} PDFs successfully`,'success');
    } catch (err) { toast('Merge failed: '+err.message,'error'); }
}

async function savePDF() {
    if (!state.pdfDoc) return;
    try {
        for (const [ps, annots] of Object.entries(state.annotations)) {
            const pn = parseInt(ps), page = state.pdfDoc.getPage(pn-1), {width,height} = page.getSize();
            let font;
            for (const a of annots) {
                const sc = 1;
                switch(a.type) {
                    case 'text':
                        if (!font) font = await state.pdfDoc.embedFont(PDFLib.StandardFonts[a.fontFamily||'Helvetica']||PDFLib.StandardFonts.Helvetica);
                        page.drawText(a.text, {x:a.x*sc, y:height-a.y*sc, size:a.fontSize||14, font, color:hexRgb(a.color)}); break;
                    case 'rect':
                        page.drawRectangle({x:a.x*sc, y:height-(a.y+a.h)*sc, width:a.w*sc, height:a.h*sc, borderColor:hexRgb(a.color), borderWidth:a.strokeWidth||2}); break;
                    case 'circle':
                        page.drawEllipse({x:(a.x+a.w/2)*sc, y:height-(a.y+a.h/2)*sc, xScale:Math.abs(a.w/2)*sc, yScale:Math.abs(a.h/2)*sc, borderColor:hexRgb(a.color), borderWidth:a.strokeWidth||2}); break;
                    case 'line': case 'arrow':
                        page.drawLine({start:{x:a.x*sc,y:height-a.y*sc}, end:{x:a.x2*sc,y:height-a.y2*sc}, color:hexRgb(a.color), thickness:a.strokeWidth||2}); break;
                    case 'highlight':
                        page.drawRectangle({x:a.x*sc, y:height-(a.y+a.h)*sc, width:a.w*sc, height:a.h*sc, color:hexRgb(a.color), opacity:0.3}); break;
                    case 'path':
                        if (a.points.length>=2) for (let i=0;i<a.points.length-1;i++)
                            page.drawLine({start:{x:a.points[i].x*sc,y:height-a.points[i].y*sc}, end:{x:a.points[i+1].x*sc,y:height-a.points[i+1].y*sc}, color:hexRgb(a.color), thickness:a.strokeWidth||2});
                        break;
                }
            }
        }
        for (const [ps, imgs] of Object.entries(state.images)) {
            const pn = parseInt(ps), page = state.pdfDoc.getPage(pn-1), {height} = page.getSize();
            for (const img of imgs) {
                let emb; if (img.data.includes('image/png')) emb = await state.pdfDoc.embedPng(img.data); else emb = await state.pdfDoc.embedJpg(img.data);
                page.drawImage(emb, {x:img.x, y:height-img.y-img.h, width:img.w, height:img.h});
            }
        }
        downloadBlob(await state.pdfDoc.save(),'edited.pdf');
        toast('PDF saved successfully!','success');
    } catch (err) { console.error(err); toast('Failed to save: '+err.message,'error'); }
}

function hexRgb(hex) { return PDFLib.rgb(parseInt(hex.slice(1,3),16)/255, parseInt(hex.slice(3,5),16)/255, parseInt(hex.slice(5,7),16)/255); }
function downloadBlob(bytes, name) { const b=new Blob([bytes],{type:'application/pdf'}), u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }

function changeZoom(d) { state.zoom=Math.max(0.25,Math.min(4,state.zoom+d)); document.getElementById('zoomLevel').textContent=Math.round(state.zoom*100)+'%'; renderPage(); }
function fitToWidth() {
    const aw = document.getElementById('canvasArea').clientWidth-48;
    if (pdfCanvas.width>0) { state.zoom=aw/(pdfCanvas.width/(state.zoom*1.5))/1.5; document.getElementById('zoomLevel').textContent=Math.round(state.zoom*100)+'%'; renderPage(); }
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
function updateStatus() { document.getElementById('statusLeft').textContent=`Page ${state.currentPage} of ${state.totalPages}`; document.getElementById('statusRight').textContent=`Zoom: ${Math.round(state.zoom*100)}% | Tool: ${state.tool}`; }
function updateDocInfo(file) { document.getElementById('docInfo').innerHTML=`<div style="margin-bottom:4px"><strong>File:</strong> ${file?file.name:'Unknown'}</div><div style="margin-bottom:4px"><strong>Pages:</strong> ${state.totalPages}</div><div><strong>Size:</strong> ${file?(file.size/1024).toFixed(1)+' KB':'N/A'}</div>`; }

function toast(msg, type='info') {
    const c = document.getElementById('toastContainer'), el = document.createElement('div');
    el.className = `toast toast-${type}`; el.textContent = msg; c.appendChild(el);
    setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
}

document.addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if (e.ctrlKey||e.metaKey) { if(e.key==='z'){e.preventDefault();undo();} if(e.key==='y'){e.preventDefault();redo();} if(e.key==='s'){e.preventDefault();savePDF();} if(e.key==='o'){e.preventDefault();fileInput.click();} return; }
    switch(e.key.toLowerCase()) {
        case 'v': setTool('select'); break; case 't': setTool('text'); break; case 'd': setTool('draw'); break;
        case 'h': setTool('highlight'); break; case 'r': setTool('rect'); break; case 'c': setTool('circle'); break;
        case 'l': setTool('line'); break; case 'a': setTool('arrow'); break; case 'e': setTool('erase'); break;
        case 'i': imageInput.click(); break;
        case 'pagedown': case 'arrowright': e.preventDefault(); goToPage(state.currentPage+1); break;
        case 'pageup': case 'arrowleft': e.preventDefault(); goToPage(state.currentPage-1); break;
        case '+': case '=': changeZoom(0.1); break; case '-': changeZoom(-0.1); break;
    }
});

document.getElementById('canvasArea').addEventListener('wheel', e => { if(e.ctrlKey){e.preventDefault();changeZoom(e.deltaY<0?0.1:-0.1);} }, {passive:false});
</script>
